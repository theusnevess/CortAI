name: CI Tests Legacy

on:
  pull_request:
    branches: ["main", "develop"]
    paths:
      - ".github/workflows/ci-tests.yml"
      - "docs/pr_checklist_observability.md"
      - "backend/app/api/v1/endpoints/metrics.py"
      - "backend/app/cognitive_metrics.py"
      - "backend/app/db/models.py"
      - "backend/alembic/**"
      - "backend/tests/test_metrics_api.py"
      - "backend/tests/conftest.py"
      - ".github/workflows/ci.yml"
  push:
    branches: ["main", "develop"]
    paths:
      - ".github/workflows/ci-tests.yml"
      - "docs/pr_checklist_observability.md"
      - "backend/app/api/v1/endpoints/metrics.py"
      - "backend/app/cognitive_metrics.py"
      - "backend/app/db/models.py"
      - "backend/alembic/**"
      - "backend/tests/test_metrics_api.py"
      - "backend/tests/conftest.py"
      - ".github/workflows/ci.yml"

jobs:
  ci-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Create .env file
        run: |
          cat > .env << EOF
          # Database
          DB_USER=cortai_admin
          DB_PASSWORD=cortai_secret_pass_123
          DB_NAME=cortai_db
          DATABASE_URL=postgresql://cortai_admin:cortai_secret_pass_123@db:5432/cortai_db
          
          # Redis
          REDIS_URL=redis://redis:6379/0
          
          # MinIO (Storage)
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin123
          MINIO_ENDPOINT=http://minio:9000
          MINIO_BUCKET_VIDEOS=videos-raw
          MINIO_BUCKET_CLIPS=clips-final
          
          # Security
          SECRET_KEY=test_secret_key_for_ci
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          
          # Cognitive Loop
          COGNITIVE_LOOP_ENABLED=1
          COGNITIVE_LOOP_MAX_STEPS=10
          EOF
      
      - name: Start services
        run: |
          docker compose up -d db redis minio
          sleep 10
      
      - name: Run Alembic migrations
        run: |
          docker compose run --rm api alembic upgrade head
      
      - name: Run pytest
        run: |
          docker compose run --rm api sh -lc "python -m pip install -q pytest && python -m pytest -q tests/test_metrics_api.py"

      - name: Smoke aggregation on empty day
        run: |
          docker compose run --rm api sh -lc "python -c \"from app.tasks.collector_tasks import aggregate_daily_metrics; r=aggregate_daily_metrics('2099-01-01'); assert r['status']=='done'; assert r['total_runs']==0; assert r['failed_runs']==0; assert r['blocked_runs']==0; print('SMOKE_OK')\""
      
      - name: Cleanup
        if: always()
        run: |
          docker compose down -v
