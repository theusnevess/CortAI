name: ci-tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compose up (api + db)
        run: |
          if [ ! -f .env ]; then
            cat > .env <<'EOF'
DB_NAME=cortai_db
DB_USER=cortai_admin
DB_PASSWORD=cortai_secret_pass_123
MINIO_ROOT_USER=minioadmin
MINIO_ROOT_PASSWORD=minioadmin123
EOF
          fi
          docker compose up -d --build db cortai_api
          sleep 10

      - name: Run migrations
        run: |
          docker exec -i cortai_api sh -lc "alembic upgrade head"

      - name: Run pytest
        run: |
          docker exec -i cortai_api sh -lc "pytest -q"

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=300 cortai_api || true
          docker compose logs --no-color --tail=300 db || true

      - name: Compose down
        if: always()
        run: |
          docker compose down -v
