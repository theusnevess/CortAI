name: P2-B1 Runner External

on:
  workflow_dispatch:
    inputs:
      sut_host:
        description: "SUT host/IP sem protocolo (ex: my-sut.example.com)"
        required: true
        type: string
      sut_scheme:
        description: "Protocolo do SUT (http ou https)"
        required: true
        default: "http"
        type: string
      direct_port:
        description: "Porta do direct path"
        required: true
        default: "8000"
        type: string
      edge_port:
        description: "Porta do edge path"
        required: true
        default: "8001"
        type: string
      run_edge:
        description: "Executar benchmark no edge path"
        required: true
        default: true
        type: boolean
      sut_ssh_host:
        description: "Host/IP para SSH no SUT (opcional)"
        required: false
        type: string
      sut_ssh_user:
        description: "Usuario SSH no SUT (opcional)"
        required: false
        type: string
      collect_edge_logs:
        description: "Coletar logs do edge via SSH"
        required: true
        default: false
        type: boolean
      duration_seconds:
        description: "Duracao por repeticao em segundos"
        required: false
        default: "30"
        type: string
      reps:
        description: "Repeticoes por ponto"
        required: false
        default: "1"
        type: string
      mode:
        description: "diag (apenas DIAG) | formal (DIAG + FORMAL se gate PASS)"
        required: false
        default: "diag"
        type: string

jobs:
  p2-b1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bash coreutils curl jq wrk openssh-client

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp_p2
          if [[ ! -f "scripts/run_p2_matrix.sh" ]]; then
            echo "::error::scripts/run_p2_matrix.sh nao encontrado no repo."
            exit 1
          fi
          sed -i 's/\r$//' scripts/run_p2_matrix.sh
          chmod +x scripts/run_p2_matrix.sh
          ls -lah scripts/run_p2_matrix.sh
          head -n 5 scripts/run_p2_matrix.sh

      - name: smoke_stop_the_line
        shell: bash
        run: |
          set -euo pipefail
          check_url() {
            local url="$1"
            curl -fsS --retry 2 --retry-all-errors --retry-delay 1 --max-time 30 "$url" >/dev/null
          }

          direct_base="${{ inputs.sut_scheme }}://${{ inputs.sut_host }}:${{ inputs.direct_port }}"
          check_url "${direct_base}/health"
          check_url "${direct_base}/api/v1/status?window_days=1"

          if [[ "${{ inputs.run_edge }}" == "true" ]]; then
            edge_base="${{ inputs.sut_scheme }}://${{ inputs.sut_host }}:${{ inputs.edge_port }}"
            check_url "${edge_base}/health"
          fi

      - name: Run DIAG direct benchmark
        shell: bash
        env:
          ENABLE_STATUS_PROBE: "1"
          STATUS_REQUESTS: "10"
          STATUS_TIMEOUT: "5"
          STATUS_PROBE_CONCURRENCY_LIST: "2"
        run: |
          set -euo pipefail
          duration="${{ inputs.duration_seconds }}"
          reps="${{ inputs.reps }}"
          [[ -z "$duration" ]] && duration="30"
          [[ -z "$reps" ]] && reps="1"
          bash ./scripts/run_p2_matrix.sh "${{ inputs.sut_scheme }}://${{ inputs.sut_host }}:${{ inputs.direct_port }}" --duration "$duration" --reps "$reps"
          if [[ ! -s ".tmp_p2/p2_a_summary.csv" ]]; then
            echo "::error::CSV base nao foi gerado para o direct."
            exit 1
          fi
          cp .tmp_p2/p2_a_summary.csv .tmp_p2/p2_a_summary_direct.csv
          cp .tmp_p2/p2_a_summary.csv .tmp_p2/p2_a_summary_direct_diag.csv
          if [[ ! -s ".tmp_p2/p2_a_summary_direct.csv" ]]; then
            echo "::error::CSV direct ausente ou vazio."
            exit 1
          fi

      - name: Run DIAG edge benchmark
        if: ${{ inputs.run_edge }}
        shell: bash
        env:
          ENABLE_STATUS_PROBE: "1"
          STATUS_REQUESTS: "10"
          STATUS_TIMEOUT: "5"
          STATUS_PROBE_CONCURRENCY_LIST: "2"
        run: |
          set -euo pipefail
          duration="${{ inputs.duration_seconds }}"
          reps="${{ inputs.reps }}"
          [[ -z "$duration" ]] && duration="30"
          [[ -z "$reps" ]] && reps="1"
          bash ./scripts/run_p2_matrix.sh "${{ inputs.sut_scheme }}://${{ inputs.sut_host }}:${{ inputs.edge_port }}" --duration "$duration" --reps "$reps"
          if [[ ! -s ".tmp_p2/p2_a_summary.csv" ]]; then
            echo "::error::CSV base nao foi gerado para o edge."
            exit 1
          fi
          cp .tmp_p2/p2_a_summary.csv .tmp_p2/p2_a_summary_edge.csv
          cp .tmp_p2/p2_a_summary.csv .tmp_p2/p2_a_summary_edge_diag.csv
          if [[ ! -s ".tmp_p2/p2_a_summary_edge.csv" ]]; then
            echo "::error::CSV edge ausente ou vazio."
            exit 1
          fi

      - name: Evaluate DIAG gate
        id: diag_gate
        shell: bash
        run: |
          set -euo pipefail

          fail=0

          evaluate_csv() {
            local csv="$1"
            local path_label="$2"
            if [[ ! -s "$csv" ]]; then
              echo "::error::CSV nao encontrado para ${path_label}: $csv"
              fail=1
              return
            fi

            while IFS=',' read -r endpoint c p90 p99 rps timeouts pct429 pct503 pct5xx; do
              [[ -z "${endpoint:-}" ]] && continue
              local decision="PASS"
              local rps_num="${rps:-0}"
              local timeouts_num="${timeouts:-0}"

              if [[ "$rps_num" == "NA" || -z "$rps_num" ]]; then
                rps_num="0"
              fi
              if [[ "$timeouts_num" == "NA" || -z "$timeouts_num" ]]; then
                timeouts_num="999999"
              fi

              if awk "BEGIN {exit !($timeouts_num > 0 || $rps_num < 1)}"; then
                decision="FAIL"
                fail=1
              fi

              echo "| ${path_label} | ${endpoint} | ${c} | ${rps} | ${timeouts} | ${decision} |" >> "$GITHUB_STEP_SUMMARY"
            done < <(tail -n +2 "$csv")
          }

          {
            echo "## DIAG Gate Result"
            echo
            echo "| path | endpoint | C | rps | timeouts | decision |"
            echo "|------|----------|---|-----|----------|----------|"
          } >> "$GITHUB_STEP_SUMMARY"

          evaluate_csv ".tmp_p2/p2_a_summary_direct.csv" "direct"
          if [[ "${{ inputs.run_edge }}" == "true" ]]; then
            evaluate_csv ".tmp_p2/p2_a_summary_edge.csv" "edge"
          fi

          if [[ "$fail" -eq 1 ]]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "STOP-THE-LINE: benchmark invalido (timeouts > 0 ou req/s < 1)." >> "$GITHUB_STEP_SUMMARY"
            echo "diag_pass=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo >> "$GITHUB_STEP_SUMMARY"
          echo "DIAG PASS: formal liberado." >> "$GITHUB_STEP_SUMMARY"
          echo "diag_pass=true" >> "$GITHUB_OUTPUT"

      - name: Run FORMAL direct benchmark
        if: ${{ inputs.mode == 'formal' && steps.diag_gate.outcome == 'success' }}
        shell: bash
        env:
          ENABLE_STATUS_PROBE: "1"
          STATUS_REQUESTS: "10"
          STATUS_TIMEOUT: "5"
          STATUS_PROBE_CONCURRENCY_LIST: "2"
        run: |
          set -euo pipefail
          bash ./scripts/run_p2_matrix.sh "${{ inputs.sut_scheme }}://${{ inputs.sut_host }}:${{ inputs.direct_port }}" --duration "60" --reps "3"
          cp .tmp_p2/p2_a_summary.csv .tmp_p2/p2_a_summary_direct_formal.csv
          cp .tmp_p2/p2_a_summary.csv .tmp_p2/p2_a_summary_direct.csv

      - name: Run FORMAL edge benchmark
        if: ${{ inputs.run_edge && inputs.mode == 'formal' && steps.diag_gate.outcome == 'success' }}
        shell: bash
        env:
          ENABLE_STATUS_PROBE: "1"
          STATUS_REQUESTS: "10"
          STATUS_TIMEOUT: "5"
          STATUS_PROBE_CONCURRENCY_LIST: "2"
        run: |
          set -euo pipefail
          bash ./scripts/run_p2_matrix.sh "${{ inputs.sut_scheme }}://${{ inputs.sut_host }}:${{ inputs.edge_port }}" --duration "60" --reps "3"
          cp .tmp_p2/p2_a_summary.csv .tmp_p2/p2_a_summary_edge_formal.csv
          cp .tmp_p2/p2_a_summary.csv .tmp_p2/p2_a_summary_edge.csv

      - name: Collect edge logs via SSH
        if: ${{ always() && inputs.collect_edge_logs }}
        shell: bash
        env:
          SUT_SSH_KEY: ${{ secrets.SUT_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${{ inputs.sut_ssh_host }}" || -z "${{ inputs.sut_ssh_user }}" ]]; then
            echo "::error::collect_edge_logs=true exige sut_ssh_host e sut_ssh_user."
            exit 1
          fi
          if [[ -z "${SUT_SSH_KEY}" ]]; then
            echo "::error::Secret SUT_SSH_KEY ausente."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SUT_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh -o StrictHostKeyChecking=no -o BatchMode=yes "${{ inputs.sut_ssh_user }}@${{ inputs.sut_ssh_host }}" '
            set -euo pipefail
            if [ -f /var/log/nginx/access.log ]; then
              tail -n 400 /var/log/nginx/access.log
            elif [ -f /var/log/nginx/edge_access.log ]; then
              tail -n 400 /var/log/nginx/edge_access.log
            elif command -v docker >/dev/null 2>&1; then
              docker logs cortai_edge --since 15m | tail -n 400
            else
              echo "Nenhum metodo de coleta de logs do edge disponivel." >&2
              exit 1
            fi
          ' > .tmp_p2/edge_logs_15m_tail400.txt

      - name: List .tmp_p2
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ls -lah .tmp_p2
          for f in .tmp_p2/p2_a_summary_direct*.csv .tmp_p2/p2_a_summary_edge*.csv .tmp_p2/status_*.txt; do
            if [[ -f "$f" ]]; then
              echo "---- $f ----"
              cat "$f"
            fi
          done

      - name: Package artifacts
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          files=()
          for f in .tmp_p2/p2_a_summary_direct*.csv .tmp_p2/p2_a_summary_edge*.csv .tmp_p2/status_*.txt; do
            if [[ -f "$f" ]]; then
              files+=("$f")
            fi
          done
          if [[ "${{ inputs.collect_edge_logs }}" == "true" && -f .tmp_p2/edge_logs_15m_tail400.txt ]]; then
            files+=(.tmp_p2/edge_logs_15m_tail400.txt)
          fi
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::Nenhum artefato para empacotar."
            exit 1
          fi
          tar -czf .tmp_p2/p2-b1-artifacts.tar.gz "${files[@]}"

      - name: Upload artifacts
        if: ${{ always() && !inputs.collect_edge_logs }}
        uses: actions/upload-artifact@v4
        with:
          name: p2-b1-artifacts
          path: .tmp_p2/p2-b1-artifacts.tar.gz
          if-no-files-found: error

      - name: Upload artifacts (with edge logs)
        if: ${{ always() && inputs.collect_edge_logs }}
        uses: actions/upload-artifact@v4
        with:
          name: p2-b1-artifacts
          path: .tmp_p2/p2-b1-artifacts.tar.gz
          if-no-files-found: error

      - name: Write summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## P2-B1 Runner External"
            echo
            echo "- direct csv: \`.tmp_p2/p2_a_summary_direct.csv\`"
            if [[ -f .tmp_p2/p2_a_summary_direct_diag.csv ]]; then
              echo "- direct diag csv: \`.tmp_p2/p2_a_summary_direct_diag.csv\`"
            fi
            if [[ -f .tmp_p2/p2_a_summary_direct_formal.csv ]]; then
              echo "- direct formal csv: \`.tmp_p2/p2_a_summary_direct_formal.csv\`"
            fi
            if [[ -f .tmp_p2/p2_a_summary_edge.csv ]]; then
              echo "- edge csv: \`.tmp_p2/p2_a_summary_edge.csv\`"
            else
              echo "- edge csv: nao gerado"
            fi
            if [[ -f .tmp_p2/p2_a_summary_edge_diag.csv ]]; then
              echo "- edge diag csv: \`.tmp_p2/p2_a_summary_edge_diag.csv\`"
            fi
            if [[ -f .tmp_p2/p2_a_summary_edge_formal.csv ]]; then
              echo "- edge formal csv: \`.tmp_p2/p2_a_summary_edge_formal.csv\`"
            fi
            if [[ -f .tmp_p2/edge_logs_15m_tail400.txt ]]; then
              echo "- edge logs: \`.tmp_p2/edge_logs_15m_tail400.txt\`"
            else
              echo "- edge logs: nao gerado"
            fi
            echo
            echo "### direct (head -n 5)"
            echo '```csv'
            head -n 5 .tmp_p2/p2_a_summary_direct.csv || true
            echo '```'
            if [[ -f .tmp_p2/p2_a_summary_edge.csv ]]; then
              echo
              echo "### edge (head -n 5)"
              echo '```csv'
              head -n 5 .tmp_p2/p2_a_summary_edge.csv || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
