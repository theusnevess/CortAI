name: P2-B1 Runner External

on:
  workflow_dispatch:
    inputs:
      sut_host:
        description: "SUT host/IP sem protocolo (ex: my-sut.example.com)"
        required: true
        type: string
      sut_scheme:
        description: "Protocolo do SUT (http ou https)"
        required: true
        default: "http"
        type: string
      direct_port:
        description: "Porta do direct path"
        required: true
        default: "8000"
        type: string
      edge_port:
        description: "Porta do edge path"
        required: true
        default: "8001"
        type: string
      run_edge:
        description: "Executar benchmark no edge path"
        required: true
        default: true
        type: boolean
      sut_ssh_host:
        description: "Host/IP para SSH no SUT (opcional)"
        required: false
        type: string
      sut_ssh_user:
        description: "Usuario SSH no SUT (opcional)"
        required: false
        type: string
      collect_edge_logs:
        description: "Coletar logs do edge via SSH"
        required: true
        default: false
        type: boolean
      duration_seconds:
        description: "Duracao por repeticao em segundos"
        required: false
        default: "30"
        type: string
      reps:
        description: "Repeticoes por ponto"
        required: false
        default: "1"
        type: string
      mode:
        description: "diag (curto) | formal (longo)"
        required: false
        default: "diag"
        type: string

jobs:
  p2-b1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bash coreutils curl jq wrk openssh-client

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp_p2
          if [[ ! -f "scripts/run_p2_matrix.sh" ]]; then
            echo "::error::scripts/run_p2_matrix.sh nao encontrado no repo."
            exit 1
          fi
          sed -i 's/\r$//' scripts/run_p2_matrix.sh
          chmod +x scripts/run_p2_matrix.sh
          ls -lah scripts/run_p2_matrix.sh
          head -n 5 scripts/run_p2_matrix.sh

      - name: smoke_stop_the_line
        shell: bash
        run: |
          set -euo pipefail
          check_url() {
            local url="$1"
            curl -fsS --retry 2 --retry-all-errors --retry-delay 1 --max-time 30 "$url" >/dev/null
          }

          direct_base="${{ inputs.sut_scheme }}://${{ inputs.sut_host }}:${{ inputs.direct_port }}"
          check_url "${direct_base}/health"
          check_url "${direct_base}/api/v1/status?window_days=1"

          if [[ "${{ inputs.run_edge }}" == "true" ]]; then
            edge_base="${{ inputs.sut_scheme }}://${{ inputs.sut_host }}:${{ inputs.edge_port }}"
            check_url "${edge_base}/health"
          fi

      - name: Run direct benchmark
        shell: bash
        env:
          STATUS_REQUESTS: "20"
          STATUS_TIMEOUT: "5"
        run: |
          set -euo pipefail
          mode="${{ inputs.mode }}"
          duration="${{ inputs.duration_seconds }}"
          reps="${{ inputs.reps }}"
          if [[ "$mode" == "formal" ]]; then
            [[ -z "$duration" || "$duration" == "30" ]] && duration="60"
            [[ -z "$reps" || "$reps" == "1" ]] && reps="3"
          else
            [[ -z "$duration" ]] && duration="30"
            [[ -z "$reps" ]] && reps="1"
          fi
          bash ./scripts/run_p2_matrix.sh "${{ inputs.sut_scheme }}://${{ inputs.sut_host }}:${{ inputs.direct_port }}" --duration "$duration" --reps "$reps"
          if [[ ! -s ".tmp_p2/p2_a_summary.csv" ]]; then
            echo "::error::CSV base nao foi gerado para o direct."
            exit 1
          fi
          cp .tmp_p2/p2_a_summary.csv .tmp_p2/p2_a_summary_direct.csv
          if [[ ! -s ".tmp_p2/p2_a_summary_direct.csv" ]]; then
            echo "::error::CSV direct ausente ou vazio."
            exit 1
          fi

      - name: Run edge benchmark
        if: ${{ inputs.run_edge }}
        shell: bash
        env:
          STATUS_REQUESTS: "20"
          STATUS_TIMEOUT: "5"
        run: |
          set -euo pipefail
          mode="${{ inputs.mode }}"
          duration="${{ inputs.duration_seconds }}"
          reps="${{ inputs.reps }}"
          if [[ "$mode" == "formal" ]]; then
            [[ -z "$duration" || "$duration" == "30" ]] && duration="60"
            [[ -z "$reps" || "$reps" == "1" ]] && reps="3"
          else
            [[ -z "$duration" ]] && duration="30"
            [[ -z "$reps" ]] && reps="1"
          fi
          bash ./scripts/run_p2_matrix.sh "${{ inputs.sut_scheme }}://${{ inputs.sut_host }}:${{ inputs.edge_port }}" --duration "$duration" --reps "$reps"
          if [[ ! -s ".tmp_p2/p2_a_summary.csv" ]]; then
            echo "::error::CSV base nao foi gerado para o edge."
            exit 1
          fi
          cp .tmp_p2/p2_a_summary.csv .tmp_p2/p2_a_summary_edge.csv
          if [[ ! -s ".tmp_p2/p2_a_summary_edge.csv" ]]; then
            echo "::error::CSV edge ausente ou vazio."
            exit 1
          fi

      - name: Collect edge logs via SSH
        if: ${{ inputs.collect_edge_logs }}
        shell: bash
        env:
          SUT_SSH_KEY: ${{ secrets.SUT_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${{ inputs.sut_ssh_host }}" || -z "${{ inputs.sut_ssh_user }}" ]]; then
            echo "::error::collect_edge_logs=true exige sut_ssh_host e sut_ssh_user."
            exit 1
          fi
          if [[ -z "${SUT_SSH_KEY}" ]]; then
            echo "::error::Secret SUT_SSH_KEY ausente."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SUT_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh -o StrictHostKeyChecking=no -o BatchMode=yes "${{ inputs.sut_ssh_user }}@${{ inputs.sut_ssh_host }}" '
            set -euo pipefail
            if [ -f /var/log/nginx/access.log ]; then
              tail -n 400 /var/log/nginx/access.log
            elif [ -f /var/log/nginx/edge_access.log ]; then
              tail -n 400 /var/log/nginx/edge_access.log
            elif command -v docker >/dev/null 2>&1; then
              docker logs cortai_edge --since 15m | tail -n 400
            else
              echo "Nenhum metodo de coleta de logs do edge disponivel." >&2
              exit 1
            fi
          ' > .tmp_p2/edge_logs_15m_tail400.txt

      - name: List .tmp_p2
        shell: bash
        run: |
          set -euo pipefail
          ls -lah .tmp_p2

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p2-b1-artifacts
          path: |
            .tmp_p2/p2_a_summary_direct.csv
            .tmp_p2/p2_a_summary_edge.csv
            .tmp_p2/status_*.txt
            .tmp_p2/edge_logs_15m_tail400.txt
          if-no-files-found: error

      - name: Write summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## P2-B1 Runner External"
            echo
            echo "- direct csv: \`.tmp_p2/p2_a_summary_direct.csv\`"
            if [[ -f .tmp_p2/p2_a_summary_edge.csv ]]; then
              echo "- edge csv: \`.tmp_p2/p2_a_summary_edge.csv\`"
            else
              echo "- edge csv: nao gerado"
            fi
            if [[ -f .tmp_p2/edge_logs_15m_tail400.txt ]]; then
              echo "- edge logs: \`.tmp_p2/edge_logs_15m_tail400.txt\`"
            else
              echo "- edge logs: nao gerado"
            fi
            echo
            echo "### direct (head -n 5)"
            echo '```csv'
            head -n 5 .tmp_p2/p2_a_summary_direct.csv || true
            echo '```'
            if [[ -f .tmp_p2/p2_a_summary_edge.csv ]]; then
              echo
              echo "### edge (head -n 5)"
              echo '```csv'
              head -n 5 .tmp_p2/p2_a_summary_edge.csv || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
