version: "3.9"

services:

  # ===============================
  # API – FastAPI
  # ===============================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortai_api
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - minio
    restart: unless-stopped

  # ===============================
  # Worker – Celery (GPU enabled)
  # ===============================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    container_name: cortai_worker
    command: >
      celery
      -A app.worker.celery_app
      worker
      --loglevel=info
      --concurrency=4
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - redis
      - db
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ===============================
  # Beat - Celery Scheduler
  # ===============================
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortai_beat
    command: >
      celery
      -A app.worker.celery_app
      beat
      --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - redis
      - db
    restart: unless-stopped

  # ===============================
  # PostgreSQL
  # ===============================
  db:
    image: postgres:16-alpine
    container_name: cortai_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ===============================
  # Redis
  # ===============================
  redis:
    image: redis:7-alpine
    container_name: cortai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ===============================
  # MinIO
  # ===============================
  minio:
    image: minio/minio:latest
    container_name: cortai_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # ===============================
  # Ollama (LLMs locais)
  # ===============================
  ollama:
    image: ollama/ollama:latest
    container_name: cortai_ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
