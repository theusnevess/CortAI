upstream cortai_api_upstream {
    server cortai_api:8000;
    keepalive 64;
}

upstream cortai_read_api_upstream {
    server cortai_read_api:8000;
    keepalive 64;
}

# Cache curto para read-path (SLO-aware delivery):
# - reduzir TTFB percebido sob concorrencia
# - preservar consistencia com snapshot-first do backend
proxy_cache_path /var/cache/nginx/cortai_read levels=1:2 keys_zone=cortai_read_cache:20m inactive=60s max_size=200m;

map $arg_force_live $edge_cache_bypass {
    default 0;
    1 1;
    true 1;
    yes 1;
}

# Formato dedicado para diagnostico de TTFB e caminho upstream.
log_format c2_diag '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   'rt=$request_time uct=$upstream_connect_time '
                   'uht=$upstream_header_time urt=$upstream_response_time '
                   'ua="$upstream_addr" us="$upstream_status"';

server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log c2_diag;

    # Cache curto para overview (snapshot-first + stale-while-revalidate).
    location = /api/v1/metrics/overview {
        proxy_pass http://cortai_read_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_cache cortai_read_cache;
        proxy_cache_key "$scheme|$host|$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_bypass $edge_cache_bypass;
        proxy_no_cache $edge_cache_bypass;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_valid 200 10s;
        proxy_cache_valid 503 1s;
        proxy_cache_valid 202 0s;
        proxy_cache_valid 429 0s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Edge-Cache $upstream_cache_status always;
        add_header Cache-Control "public, max-age=10, stale-while-revalidate=30" always;
    }

    # Cache curto para runs list (snapshot-first + stale-while-revalidate).
    location = /api/v1/metrics/runs {
        proxy_pass http://cortai_read_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_cache cortai_read_cache;
        proxy_cache_key "$scheme|$host|$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_bypass $edge_cache_bypass;
        proxy_no_cache $edge_cache_bypass;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_valid 200 10s;
        proxy_cache_valid 503 1s;
        proxy_cache_valid 202 0s;
        proxy_cache_valid 429 0s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Edge-Cache $upstream_cache_status always;
        add_header Cache-Control "public, max-age=10, stale-while-revalidate=30" always;
    }

    # Read-path dedicado para rotas sem cache explícito.
    location /api/v1/metrics/ {
        proxy_pass http://cortai_read_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /api/v1/observability/report {
        proxy_pass http://cortai_read_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /api/v1/status {
        proxy_pass http://cortai_read_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://cortai_read_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://cortai_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

